name: Pull Request Workflow

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:

  lint:
    name: Verificação de estilo (Lint)
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositório
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Instalar Node
      uses: actions/setup-node@v3
      with:
        node-version: 22
        cache: 'npm'

    - name: Instalar dependências
      run: npm install

    - name: Rodar ESLint
      run: npx eslint . || true


  test:
    name: Testes e cobertura
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositório
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Instalar Node
      uses: actions/setup-node@v3
      with:
        node-version: 22
        cache: 'npm'

    - name: Instalar dependências
      run: npm install

    - name: Verificar se branch está atualizada com main
      run: |
        git fetch origin main
        if ! git merge-base --is-ancestor origin/main HEAD; then
          echo "Branch desatualizada com a main. Faça rebase ou merge."
          exit 1
        fi

    - name: Rodar testes com cobertura
      run: npm run test:ci